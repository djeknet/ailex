<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Input</title>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --primary: 142.1 76.2% 36.3%;
      --primary-foreground: 355.7 100% 97.3%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --radius: 0.65rem;
    }

    .dark {
      --background: 20 14.3% 4.1%;
      --foreground: 0 0% 95%;
      --card: 24 9.8% 10%;
      --card-foreground: 0 0% 95%;
      --primary: 142.1 70.6% 45.3%;
      --primary-foreground: 144.9 80.4% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 0 0% 15%;
      --muted-foreground: 240 5% 64.9%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 85.7% 97.3%;
      --border: 240 3.7% 15.9%;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-left: 20px;
      padding-right: 20px;
      text-align: center;
    }
    
    #microphone-icon {
      width: 120px;
      height: 120px;
      background: hsl(var(--muted));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      transition: all 0.3s;
      color: hsl(var(--muted-foreground));
    }
    
    #microphone-icon.active {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 hsl(var(--primary) / 0.7);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 20px hsl(var(--primary) / 0);
      }
    }
    
    #status {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      color: hsl(var(--foreground));
    }
    
    #transcript {
      background: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
      border-radius: calc(var(--radius) * 1.5);
      padding: 24px;
      min-height: 100px;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
      font-size: 18px;
      line-height: 1.6;
      word-wrap: break-word;
      color: hsl(var(--foreground));
    }
    
    #transcript.empty {
      color: hsl(var(--muted-foreground));
      font-style: italic;
    }
    
    #error {
      display: none;
      background: hsl(var(--destructive));
      color: hsl(var(--destructive-foreground));
      padding: 16px 24px;
      border-radius: var(--radius);
      margin-top: 20px;
      max-width: 500px;
    }
    
    #controls {
      background: hsl(var(--card));
      border-top: 1px solid hsl(var(--border));
      padding: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    
    button {
      padding: 12px 24px;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
    }
    
    button:hover:not(:disabled) {
      background: hsl(var(--muted));
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #start-btn {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    
    #start-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    
    #start-btn.active {
      background: hsl(var(--destructive));
      border-color: hsl(var(--destructive));
      color: hsl(var(--destructive-foreground));
    }
    
    #done-btn {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    
    #done-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    
    .icon {
      width: 18px;
      height: 18px;
    }
    
    .mic-icon {
      width: 60px;
      height: 60px;
    }
  </style>
</head>
<body>
  <div id="main-container">
    <div id="microphone-icon">
      <svg class="mic-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
    
    <div id="status">Click Start to begin</div>
    
    <div id="transcript" class="empty">Your speech will appear here...</div>
    
    <div id="error"></div>
  </div>
  
  <div id="controls">
    <button id="cancel-btn">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      Cancel
    </button>
    <button id="start-btn">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
      </svg>
      Start
    </button>
    <button id="done-btn" disabled>
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      Done
    </button>
  </div>
  
  <script src="microphone.js"></script>
</body>
</html>
