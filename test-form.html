<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form Page - AiLex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        label .required {
            color: #e53e3e;
            margin-left: 4px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-box {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 16px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box p {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Contact Form</h1>
        <p class="subtitle">Test page for AiLex form filling tool</p>

        <div class="info-box">
            <p>💡 <strong>Testing Instructions:</strong> Use the <code>/fillform</code> command in AiLex to automatically fill this form with your personal information from extension settings.</p>
        </div>

        <form id="contactForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">
                        First Name
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        placeholder="John" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName" 
                        placeholder="Doe" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    Email Address
                    <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="john.doe@example.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="+1 (555) 123-4567"
                >
            </div>

            <div class="form-group">
                <label for="company">
                    Company
                </label>
                <input 
                    type="text" 
                    id="company" 
                    name="company" 
                    placeholder="Acme Corporation"
                >
            </div>

            <div class="form-group">
                <label for="position">
                    Job Position
                </label>
                <input 
                    type="text" 
                    id="position" 
                    name="position" 
                    placeholder="Software Engineer"
                >
            </div>

            <div class="form-group">
                <label for="address">
                    Street Address
                </label>
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    placeholder="123 Main Street"
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">
                        City
                    </label>
                    <input 
                        type="text" 
                        id="city" 
                        name="city" 
                        placeholder="New York"
                    >
                </div>

                <div class="form-group">
                    <label for="zipCode">
                        ZIP Code
                    </label>
                    <input 
                        type="text" 
                        id="zipCode" 
                        name="zipCode" 
                        placeholder="10001"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="country">
                    Country
                </label>
                <select id="country" name="country">
                    <option value="">Select a country...</option>
                    <option value="USA">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="Russia">Russia</option>
                    <option value="Japan">Japan</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">
                    Message
                </label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="Tell us more about your inquiry..."
                ></textarea>
            </div>

            <button type="submit">Submit Form</button>
        </form>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            
            alert('Form submitted successfully!\n\n' + JSON.stringify(data, null, 2));
        });
    </script>
</body>
</html>
